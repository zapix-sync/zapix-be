spring:
  application:
    name: zapix

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/zapix
    username: zapix
    password: zapix

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

zapix:
  notification:
    cron: "0 * * * * *"
    delay-ms: 0
  whatsapp:
    gateway: evolution
  pix:
    gateway: stripe

evolution:
  base-url: http://localhost:8081
  api-key: ${EVOLUTION_API_KEY:}
  instance: Zapix

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: http://localhost:3000/payment/success